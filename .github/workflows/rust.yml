name: Rust

# Same gates as Talon 2.0 (liohtml/talahon .github/workflows/ci.yml), plus every
# end-to-end suite against MySQL at the Alembic head, and the deployment checks
# (the Compose files, .env.example and the Rust image against what the binary
# reads: scripts/check-compose.py; the Dockerfile through hadolint).

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rustfmt.toml"
      - "clippy.toml"
      - "backend/alembic/**"
      # Embedded by copilot-grafana-dashboards (its vectors pin every template)
      # and by copilot-integration-provisioning (the collectors' files, the
      # Wazuh group configurations, the Portainer worker stack).
      - "backend/app/connectors/grafana/dashboards/**"
      - "backend/app/integrations/*/templates/**"
      - "backend/app/customer_provisioning/templates/**"
      - "backend/app/connectors/portainer/templates/**"
      # Embedded by copilot-incidents (a test pins the list to the directory)
      # and by copilot-reports, with the SOC and Grafana report templates.
      - "backend/app/incidents/templates/**"
      - "backend/app/soc_management/templates/**"
      - "backend/app/connectors/grafana/reporting/**"
      - "scripts/check-alembic-head.py"
      - ".github/workflows/rust.yml"
      # The deployment checks.
      - "docker-compose*.yml"
      - ".env.example"
      - "scripts/check-compose.py"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "backend/alembic/**"
      - "backend/app/connectors/grafana/dashboards/**"
      - "backend/app/integrations/*/templates/**"
      - "backend/app/customer_provisioning/templates/**"
      - "backend/app/connectors/portainer/templates/**"
      - "backend/app/incidents/templates/**"
      - "backend/app/soc_management/templates/**"
      - "backend/app/connectors/grafana/reporting/**"
      - ".github/workflows/rust.yml"
      - "docker-compose*.yml"
      - ".env.example"
      - "scripts/check-compose.py"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  msrv:
    name: MSRV (1.85, as Talon)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.85.0

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --locked

  e2e:
    name: end-to-end (MySQL at the Alembic head)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: copilot
          MYSQL_USER: copilot
          MYSQL_PASSWORD: copilot
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fixture matches the migrations
        run: python3 scripts/check-alembic-head.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Load schema
        run: mysql -h 127.0.0.1 -uroot -proot copilot < crates/copilot/tests/fixtures/schema.sql

      # The report suites' success paths (e2e_reports, e2e_file_analysis): the
      # PDFs through wkhtmltopdf where pdfkit looks for it, the charts' DejaVu
      # Sans, and the Chromium headless shell Playwright 1.59 installs (the
      # backend's requirements.txt pin, as the Rust image installs it) for the
      # Grafana report. Without them those suites check the failure instead.
      - name: Report tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wkhtmltopdf fonts-dejavu-core
          python3 -m venv "$RUNNER_TEMP/playwright"
          "$RUNNER_TEMP/playwright/bin/pip" install --no-cache-dir "playwright==1.59.0"
          "$RUNNER_TEMP/playwright/bin/playwright" install --with-deps --only-shell chromium

      - name: Build the suites
        run: cargo test -p copilot --tests --locked --no-run

      # Every crates/copilot/tests/e2e*.rs, one after another, each single-threaded.
      - name: End-to-end
        env:
          COPILOT_TEST_DATABASE_URL: mysql://copilot:copilot@127.0.0.1:3306/copilot
        run: |
          for suite in crates/copilot/tests/e2e*.rs; do
            name=$(basename "$suite" .rs)
            echo "::group::$name"
            cargo test -p copilot --test "$name" --locked -- --test-threads=1
            echo "::endgroup::"
          done

  deployment:
    name: deployment (Compose, .env.example, the Rust image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # docker compose config resolves the layouts without a daemon.
      - name: Compose files, .env.example, the image's inputs
        run: python3 scripts/check-compose.py

      - name: Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: crates/copilot/Dockerfile

  advisories:
    name: dependency advisories (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
