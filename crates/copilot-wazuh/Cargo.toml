[package]
name = "copilot-wazuh"
description = "Wazuh indexer and manager connectors: the elasticsearch-py and requests clients as CoPilot uses them, /api/alerts, /api/wazuh_indexer, /api/snapshots, /api/wazuh_manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
copilot-core = { workspace = true }
copilot-db = { workspace = true }
copilot-auth = { workspace = true }
copilot-web = { workspace = true }
copilot-connectors = { workspace = true }
copilot-scheduler = { workspace = true }
copilot-upstream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
hyper = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
sqlx = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
idna = { workspace = true }
url = { workspace = true }
# aiohttp asks for gzip/deflate and decodes the answer: the async client does too.
flate2 = { workspace = true }
# The sync client's own HTTP/1.1 exchange (urllib3 sends no `Accept`, which
# reqwest adds to every request): the versions copilot-velociraptor builds.
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }

[dev-dependencies]
wiremock = { workspace = true }

[lints]
workspace = true
