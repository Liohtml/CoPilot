exclude: "^backend/app/routers/__init__.py$|^backend/app/db/all_models.py$"
repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.4.0
      hooks:
          - id: check-merge-conflict
          - id: check-yaml
            args: ["--unsafe"]
          # The rule files under crates/copilot-searches/tests/fixtures/rules are byte-exact
          # copies of socfortress/CoPilot-Search-Queries: the YAML vectors cut and edit them by
          # position, so their whitespace stays as upstream wrote it.
          - id: end-of-file-fixer
            exclude: '\.json$|^crates/copilot-searches/tests/fixtures/rules/'
          - id: check-json
          - id: trailing-whitespace
            exclude: ^crates/copilot-searches/tests/fixtures/rules/
          - id: check-added-large-files
          #- id: detect-private-key # Not using since uploading nginx key
          - id: requirements-txt-fixer
            args: ["backend/requirements.txt", "backend/requirements.in"]

    - repo: https://github.com/PyCQA/isort
      rev: 5.12.0
      hooks:
          - id: isort
            name: Sort python imports (shows diff)
            args: ["-c", "--diff"]
          - id: isort
            name: Sort python imports (fixes files)

    - repo: https://github.com/psf/black
      rev: 23.7.0
      hooks:
          - id: black
            language_version: python3.11
            exclude: ^backend/app/connectors/velociraptor/services/artifacts.py$

    - repo: https://github.com/asottile/setup-cfg-fmt
      rev: v2.4.0
      hooks:
          - id: setup-cfg-fmt

    - repo: https://github.com/asottile/add-trailing-comma
      rev: v3.2.0
      hooks:
          - id: add-trailing-comma

    - repo: https://github.com/PyCQA/flake8
      rev: 6.0.0
      hooks:
          - id: flake8
            name: Check project styling

    - repo: https://github.com/pre-commit/mirrors-eslint
      rev: v10.2.1
      hooks:
          - id: eslint
            args: ["--config", "frontend/eslint.config.mjs"]
            # crates/: Playwright's injected scripts, kept verbatim, not frontend code.
            exclude: ^(docs/|tools/|crates/)
