# Run the Rust backend in front of the Python one (docs/architecture/RUST_MIGRATION.md).
#
#   docker compose -f docker-compose.yml -f docker-compose.rust.yml up -d
#
# copilot-rs takes host port 5000 — the port the frontend, the Customer Portal
# and Talon already call — answers the ported modules itself and streams every
# other request to copilot-backend, which keeps running unchanged (migrations,
# scheduler, all unported routes) but is no longer published on the host.
# Remove this file from the command line to roll back.
services:
    copilot-backend:
        ports: !reset []

    copilot-rs:
        image: ghcr.io/socfortress/copilot-rs:latest
        build:
            context: .
            dockerfile: crates/copilot/Dockerfile
        ports:
            - "5000:5000"
        env_file: .env
        volumes:
            # The Velociraptor connector's api.config.yaml: its row holds a path in
            # the backend's data directory (where the connector's YAML upload puts
            # it), read here at that same path. Read-only, so the YAML upload is
            # handed to copilot-backend (which writes the directory as root);
            # drop ":ro" and give uid 10001 the directory to have this service
            # write it.
            - ./data/data:/opt/copilot/backend/data:ro
        environment:
            - COPILOT_LEGACY_URL=http://copilot-backend:5000
            # Opt-in: scheduled jobs this service may take over from APScheduler
            # (ids, comma-separated: prune_audit_log, invoke_palace_lesson_drainer,
            # invoke_palace_lesson_sweeper, or "all"; COPILOT_RS_PALACE_JOBS=true
            # names the two palace jobs). A job moves only when it is then paused
            # in the Scheduler UI; Start hands it back.
            - COPILOT_RS_JOBS=${COPILOT_RS_JOBS:-}
            - COPILOT_RS_PALACE_JOBS=${COPILOT_RS_PALACE_JOBS:-false}
        depends_on:
            - copilot-mysql
            - copilot-backend
        restart: always
