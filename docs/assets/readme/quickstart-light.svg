ion:l8 16.0s linear infinite}@keyframes l9{0%,70.61%{opacity:0}70.62%,95.62%{opacity:1}100%{opacity:0}}.l9{animation:l9 16.0s linear infinite}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rm-hide { display: none; } }</style><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".28"/></filter></defs><rect x="24" y="16" width="912" height="372" rx="16" fill="#14161A" filter="url(#sh)"/><rect x="24" y="16" width="912" height="372" rx="16" fill="#14161A" stroke="#43444C"/><path d="M24 32 a16 16 0 0 1 16 -16 H920 a16 16 0 0 1 16 16 V52 H24 Z" fill="#1D1F25"/><circle cx="48" cy="34" r="6" fill="#FF5F57"/><circle cx="68" cy="34" r="6" fill="#FEBC2E"/><circle cx="88" cy="34" r="6" fill="#28C840"/><text x="480.0" y="39" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" fill="#747E88">~/CoPilot — bash</text><style>@keyframes lp{0%,75.61%{opacity:0}75.62%,95.62%{opacity:1}100%{opacity:0}}.lp{animation:lp 16.0s linear infinite}@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rm-hide { display: none; } }</style><defs><clipPath id="screen"><rect x="25" y="52" width="910" height="335" rx="0"/></clipPath></defs><g clip-path="url(#screen)"><text class="l0" x="50" y="86" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.3" fill="#E6E9EE" xml:space="preserve"><tspan fill="#00E19B">❯ </tspan>git clone https://github.com/socfortress/CoPilot.git &amp;&amp; cd CoPilot</text><rect class="c0 rm-hide" x="67" y="68" width="637" height="28" fill="#14161A"/><text class="l1" x="50" y="114" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.3" fill="#E6E9EE" xml:space="preserve"><tspan fill="#00E19B">❯ </tspan>cp .env.example .env          # set JWT_SECRET and the passwords</text><rect class="c1 rm-hide" x="67" y="96" width="620" height="28" fill="#14161A"/><text class="l2" x="50" y="142" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.3" fill="#E6E9EE" xml:space="preserve"><tspan fill="#00E19B">❯ </tspan>docker compose up -d</text><rect class="c2 rm-hide" x="67" y="124" width="241" height="28" fill="#14161A"/><text class="l3" x="50" y="170" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.3" font-weight="400" fill="#00E19B" xml:space="preserve"> ✔ Container copilot-mysql          Healthy</text><text class="l4" x="50" y="198" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.3" font-weight="400" fill="#00E19B" xml:space="preserve"> ✔ Container copilot-backend-init   Exited</text><text class="l5" x="50" y="226" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.3" font-weight="400" fill="#00E19B" xml:space="preserve"> ✔ Container copilot-backend        Healthy</text><text class="l6" x="50" y="254" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.3" font-weight="400" fill="#00E19B" xml:space="preserve"> ✔ Container copilot-frontend       Started</text><text class="l7" x="50" y="282" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.3" fill="#E6E9EE" xml:space="preserve"><tspan fill="#00E19B">❯ </tspan>docker compose logs copilot-backend | grep &quot;Admin user password&quot;</text><rect class="c7 rm-hide" x="67" y="264" width="620" height="28" fill="#14161A"/><text class="l8" x="50" y="310" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.3" font-weight="400" fill="#ACB5BE" xml:space="preserve"> Admin user password: ●●●●●●●●●●●●●●●●</text><text class="l9" x="50" y="338" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.3" font-weight="700" fill="#FFB600" xml:space="preserve">→ open https://&lt;your-host&gt; and sign in as admin</text><g class="lp"><text x="50" y="366" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14.3" fill="#00E19B">❯</text><rect class="cur" x="67" y="352" width="9" height="18" fill="#E6E9EE"/></g></g></svg>
